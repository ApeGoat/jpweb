spring.application.name=jpwebsite-backend
spring.config.import=optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jpweb}
spring.datasource.username=${POSTGRES_USER:jpweb}
spring.datasource.password=${POSTGRES_PASSWORD:jpweb_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:change-me}
app.cors.allowed-origin=${FRONTEND_ORIGIN}

app.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
app.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID:replace-me}
app.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:replace-me}
app.r2.bucket=${CLOUDFLARE_R2_BUCKET:replace-me}
app.r2.public-base-url=${CLOUDFLARE_R2_PUBLIC_BASE_URL:https://example.invalid}
app.r2.force-path-style=${CLOUDFLARE_R2_FORCE_PATH_STYLE:true}

# Opt-in so normal application startup never writes seed data.
app.gallery-seed.enabled=${GALLERY_SEED_ENABLED:false}

server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true